<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Purple Messenger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f3ff; height: 100vh; overflow: hidden; }
    
    /* Login Screen */
    .login-screen {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: linear-gradient(135deg, #7c3aed, #a855f7);
    }
    .login-box {
      background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
    }
    .login-box h1 { color: #7c3aed; margin-bottom: 20px; }
    .login-box input {
      width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e5e7eb;
      border-radius: 10px; font-size: 16px; outline: none;
    }
    .login-box button {
      width: 100%; padding: 12px; background: #7c3aed; color: white; border: none;
      border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
    }

    /* App Layout */
    .app { display: none; height: 100vh; display: flex; flex-direction: column; }
    .app.active { display: flex; }

    /* Sidebar */
    .sidebar {
      width: 340px; background: white; border-right: 1px solid #e5e7eb;
      display: flex; flex-direction: column;
    }
    .sidebar-header { padding: 20px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; }
    .tabs { display: flex; padding: 10px; gap: 5px; background: white; border-bottom: 1px solid #e5e7eb; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: #f3f4f6; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .tab-btn.active { background: #7c3aed; color: white; }
    .search-box { padding: 10px; }
    .search-box input { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; }
    
    .user-list { flex: 1; overflow-y: auto; padding: 10px; }
    .user-item {
      display: flex; align-items: center; padding: 10px; border-radius: 12px;
      cursor: pointer; margin-bottom: 5px;
    }
    .user-item:hover, .user-item.active { background: #f5f3ff; }
    .user-avatar {
      width: 40px; height: 40px; background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: bold; margin-right: 10px;
    }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-last-msg { font-size: 13px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Badges */
    .badge { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; vertical-align: middle; }
    .online { background: #22c55e; }
    .offline { background: #9ca3af; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #f5f3ff; position: relative; }
    .chat-header {
      padding: 15px; background: white; border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .chat-header .user-avatar { width: 35px; height: 35px; font-size: 14px; margin-right: 10px; }
    
    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px;
      padding-bottom: 80px; /* ВАЖНО: отступ снизу, чтобы инпут не перекрывал сообщения */
    }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .sent { align-self: flex-end; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; border-bottom-right-radius: 4px; }
    .received { align-self: flex-start; background: white; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .message img, .message video { max-width: 100%; border-radius: 10px; margin-top: 5px; }
    .message audio { width: 200px; margin-top: 5px; }
    .msg-sender { font-size: 11px; color: #7c3aed; margin-bottom: 2px; font-weight: bold; }
    .sent .msg-sender { color: rgba(255,255,255,0.8); text-align: right; }
    .msg-time { font-size: 10px; opacity: 0.7; text-align: right; margin-top: 4px; }

    /* Input Area */
    .input-area {
      padding: 10px; background: white; border-top: 1px solid #e5e7eb;
      display: flex; align-items: flex-end; gap: 8px;
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 10;
    }
    .input-actions button {
      width: 36px; height: 36px; border: none; border-radius: 50%; background: #f3f4f6; color: #7c3aed; font-size: 18px; cursor: pointer;
    }
    .text-input-wrapper { flex: 1; }
    .text-input-wrapper textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 20px;
      font-size: 15px; resize: none; outline: none; max-height: 100px;
    }
    .send-btn {
      width: 40px; height: 40px; border: none; border-radius: 50%;
      background: #7c3aed; color: white; font-size: 18px; cursor: pointer;
    }

    /* Empty State */
    .empty-chat {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; color: #9ca3af; text-align: center;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: absolute; z-index: 20; height: 100%; transition: transform 0.3s; }
      .sidebar.hidden { transform: translateX(-100%); }
      .chat-area { width: 100%; }
      .back-btn { display: flex !important; margin-right: 10px; }
      .message { max-width: 85%; }
    }
    .back-btn { display: none; width: 30px; height: 30px; border: none; background: #f3f4f6; border-radius: 50%; cursor: pointer; align-items: center; justify-content: center; font-size: 16px; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>💜 Purple</h1>
      <input type="text" id="usernameInput" placeholder="Придумайте логин..." maxlength="20">
      <input type="password" id="passwordInput" placeholder="Придумайте пароль...">
      <button onclick="login()">Войти ✨</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="app" id="app">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>💬 Чаты</h3>
        <small id="myUsernameDisplay"></small>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('conversations')">📜 Чаты</button>
        <button class="tab-btn" onclick="switchTab('online')">🟢 Онлайн</button>
        <button class="tab-btn" onclick="switchTab('all')">👥 Все</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск..." oninput="renderConversations()">
      </div>
      <div class="user-list" id="userList"></div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="empty-chat" id="emptyChat">
        <h2>💜 Purple Messenger</h2>
        <p>Выберите чат, чтобы начать общение</p>
      </div>

      <div class="chat-header" id="chatHeader" style="display:none;">
        <button class="back-btn" onclick="showSidebar()">←</button>
        <div class="user-avatar" id="chatAvatar"></div>
        <div class="user-name" id="chatName"></div>
      </div>

      <div class="messages" id="messages" style="display:none;"></div>

      <div class="input-area" id="inputArea" style="display:none;">
        <div class="input-actions">
          <button onclick="document.getElementById('photoInput').click()">📷</button>
          <button id="voiceBtn" onclick="toggleVoiceRecording()">🎤</button>
        </div>
        <div class="text-input-wrapper">
          <textarea id="messageInput" placeholder="Сообщение..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>

      <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)" style="display:none;">
    </div>
  </div>

  <script>
    let username = '';
    let ws = null;
    let currentUser = null;
    let messages = [];
    let conversations = [];
    let connectedUsers = [];
    let allUsers = [];
    let currentTab = 'conversations';
    
    // Recording vars
    let voiceChunks = [];
    let isRecording = false;
    let voiceRecorder = null;
    let voiceDuration = 0;
    let voiceInterval = null;

    function login() {
      const user = document.getElementById('usernameInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      if (!user || !pass) { alert('Введите логин и пароль!'); return; }
      
      username = user;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('active');
      document.getElementById('myUsernameDisplay').textContent = user;
      
      connect(pass);
    }

    function connect(password) {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
      
      ws.onopen = () => console.log('Connected');
      ws.onmessage = (event) => handleMessage(JSON.parse(event.data));
      ws.onclose = () => setTimeout(connect, 3000); // Авто-переподключение
    }

    function handleMessage(data) {
      switch(data.type) {
        case 'online_users': connectedUsers = data.users; renderConversations(); break;
        case 'all_users': allUsers = data.users; renderConversations(); break;
        case 'conversations': 
          conversations = data.conversations; 
          renderConversations(); 
          break;
        case 'chat_history':
          if (data.user === currentUser) {
            messages = data.messages;
            renderMessages();
          }
          break;
        case 'chat': case 'photo': case 'voice':
          messages.push(data);
          renderMessages();
          // Обновляем список чатов
          const idx = conversations.findIndex(c => c.from === data.from && c.to === data.to);
          if (idx >= 0) conversations.splice(idx, 1);
          conversations.unshift(data);
          renderConversations();
          break;
        case 'online_update':
          connectedUsers = data.users;
          renderConversations();
          break;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderConversations();
    }

    function renderConversations() {
      const list = document.getElementById('userList');
      const query = document.getElementById('searchInput').value.toLowerCase();
      let items = [];

      if (currentTab === 'conversations') {
        items = conversations.filter(c => {
          const u = c.from === username ? c.to : c.from;
          return u.toLowerCase().includes(query);
        });
      } else if (currentTab === 'online') {
        items = connectedUsers.filter(u => u !== username && u.toLowerCase().includes(query));
      } else {
        items = allUsers.filter(u => u !== username && u.toLowerCase().includes(query));
      }

      list.innerHTML = items.map(item => {
        const isOnline = connectedUsers.includes(item);
        const lastMsg = item.type ? getLastMsgText(item) : '';
        const time = item.timestamp ? new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
        const initial = item.charAt ? item.charAt(0).toUpperCase() : 'U';
        
        return `
          <div class="user-item ${item === currentUser ? 'active' : ''}" onclick="selectUser('${item}')">
            <div class="user-avatar">${initial}</div>
            <div class="user-info">
              <div style="display:flex; justify-content:space-between;">
                <div class="user-name">${item} <span class="badge ${isOnline ? 'online' : 'offline'}"></span></div>
                <div class="user-last-msg">${time}</div>
              </div>
              <div class="user-last-msg">${lastMsg || 'Начните общение'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function getLastMsgText(msg) {
      if (!msg) return '';
      if (msg.type === 'chat') return msg.text;
      if (msg.type === 'photo') return '📷 Фото';
      if (msg.type === 'voice') return '🎤 Голосовое';
      return '';
    }

    function selectUser(user) {
      currentUser = user;
      document.getElementById('emptyChat').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('messages').style.display = 'flex';
      document.getElementById('inputArea').style.display = 'flex';
      document.getElementById('chatAvatar').textContent = user.charAt(0).toUpperCase();
      document.getElementById('chatName').textContent = user;
      document.getElementById('sidebar').classList.add('hidden');
      
      messages = [];
      ws.send(JSON.stringify({ type: 'get_chat', to: user }));
    }

    function showSidebar() {
      document.getElementById('sidebar').classList.remove('hidden');
      currentUser = null;
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      if (!currentUser) return;
      
      const chatMsgs = messages.filter(m =>
        (m.from === currentUser && m.to === username) ||
        (m.from === username && m.to === currentUser)
      );

      container.innerHTML = chatMsgs.map(m => {
        const isSent = m.from === username;
        const time = new Date(m.timestamp).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
        let content = '';
        
        if (m.type === 'chat') content = `<div>${m.text}</div>`;
        else if (m.type === 'photo') content = `<img src="${m.url}">`;
        else if (m.type === 'voice') content = `<audio controls src="${m.url}"></audio>`;
        
        return `
          <div class="message ${isSent ? 'sent' : 'received'}">
            ${!isSent ? `<div class="msg-sender">${m.from}</div>` : ''}
            ${content}
            <div class="msg-time">${time}</div>
          </div>
        `;
      }).join('');
      
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentUser) return;
      
      ws.send(JSON.stringify({
        type: 'chat', from: username, to: currentUser, text: text
      }));
      input.value = '';
      input.style.height = 'auto';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function handlePhoto(e) {
      const file = e.target.files[0];
      if (!file || !currentUser) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        ws.send(JSON.stringify({
          type: 'photo', from: username, to: currentUser, url: ev.target.result
        }));
      };
      reader.readAsDataURL(file);
    }

    async function toggleVoiceRecording() {
      if (isRecording) {
        voiceRecorder.stop();
      } else {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        voiceChunks = [];
        voiceRecorder = new MediaRecorder(stream);
        voiceRecorder.ondataavailable = e => { if(e.data.size > 0) voiceChunks.push(e.data); };
        voiceRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          if (voiceChunks.length > 0) {
            const blob = new Blob(voiceChunks, { type: 'audio/ogg' });
            const url = URL.createObjectURL(blob);
            ws.send(JSON.stringify({ type: 'voice', from: username, to: currentUser, url, duration: voiceDuration }));
          }
          voiceDuration = 0;
          isRecording = false;
          document.getElementById('voiceBtn').textContent = '🎤';
        };
        voiceRecorder.start();
        isRecording = true;
        document.getElementById('voiceBtn').textContent = '⏹';
        voiceInterval = setInterval(() => { voiceDuration++; }, 1000);
      }
    }
  </script>
</body>
</html>
