<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purple Messenger</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --primary-light: #a78bfa;
      --primary-bg: #f5f3ff;
      --purple-gradient: linear-gradient(135deg, #7c3aed, #a855f7);
      --dark-purple: #4c1d95;
      --text-dark: #1e1b4b;
      --text-light: #6b7280;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(124, 58, 237, 0.15);
      --shadow-lg: 0 8px 30px rgba(124, 58, 237, 0.25);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--primary-bg);
      height: 100vh;
      overflow: hidden;
    }

    /* Login Screen */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--purple-gradient);
    }

    .login-box {
      background: var(--white);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      width: 400px;
      max-width: 90vw;
    }

    .login-box .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .login-box h1 {
      color: var(--primary);
      font-size: 28px;
      margin-bottom: 8px;
    }

    .login-box p {
      color: var(--text-light);
      margin-bottom: 32px;
      font-size: 14px;
    }

    .login-box input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 16px;
    }

    .login-box input:focus {
      border-color: var(--primary);
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--purple-gradient);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-box button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    /* Main App */
    .app {
      display: none;
      height: 100vh;
    }

    .app.active {
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 340px;
      background: var(--white);
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .sidebar-header {
      padding: 20px;
      background: var(--purple-gradient);
      color: white;
    }

    .sidebar-header h2 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .sidebar-header .my-username {
      font-size: 13px;
      opacity: 0.85;
    }

    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      border-color: var(--primary-light);
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .user-list::-webkit-scrollbar {
      width: 6px;
    }

    .user-list::-webkit-scrollbar-thumb {
      background: var(--primary-light);
      border-radius: 3px;
    }

    .user-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 4px;
    }

    .user-item:hover {
      background: var(--primary-bg);
    }

    .user-item.active {
      background: var(--primary-bg);
      border: 2px solid var(--primary-light);
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--purple-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
      margin-right: 14px;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: 600;
      color: var(--text-dark);
      font-size: 15px;
    }

    .user-last-msg {
      color: var(--text-light);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--primary-bg);
    }

    .chat-header {
      padding: 16px 24px;
      background: var(--white);
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .chat-header .user-avatar {
      width: 42px;
      height: 42px;
      font-size: 16px;
    }

    .chat-header .user-name {
      font-size: 17px;
    }

    .chat-header .online-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      margin-left: 8px;
      display: inline-block;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--primary-light);
      border-radius: 3px;
    }

    .message {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      animation: msgIn 0.3s ease;
      word-wrap: break-word;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.sent {
      align-self: flex-end;
      background: var(--purple-gradient);
      color: white;
      border-bottom-right-radius: 6px;
    }

    .message.received {
      align-self: flex-start;
      background: var(--white);
      color: var(--text-dark);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .message .sender-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .message.sent .sender-name {
      color: rgba(255,255,255,0.8);
    }

    .message .time {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .message img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .message img:hover {
      transform: scale(1.02);
    }

    .message audio {
      width: 250px;
      height: 40px;
      margin-top: 4px;
    }

    .message video {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .message-type-label {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
      font-style: italic;
    }

    /* Empty state */
    .empty-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: var(--text-light);
    }

    .empty-chat .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-chat h3 {
      color: var(--primary);
      margin-bottom: 8px;
    }

    /* Input Area */
    .input-area {
      padding: 16px 20px;
      background: var(--white);
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .input-actions {
      display: flex;
      gap: 6px;
    }

    .input-actions button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 14px;
      background: var(--primary-bg);
      color: var(--primary);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-actions button:hover {
      background: var(--primary);
      color: white;
      transform: scale(1.05);
    }

    .input-actions button.recording {
      background: #ef4444;
      color: white;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .text-input-wrapper {
      flex: 1;
      position: relative;
    }

    .text-input-wrapper textarea {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 44px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    .text-input-wrapper textarea:focus {
      border-color: var(--primary-light);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 14px;
      background: var(--purple-gradient);
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow);
    }

    /* Recording indicator */
    .recording-indicator {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 14px;
      color: #dc2626;
      font-weight: 600;
      font-size: 14px;
    }

    .recording-indicator.active {
      display: flex;
    }

    .recording-indicator .dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    /* Image Modal */
    .image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .image-modal.active {
      display: flex;
    }

    .image-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }

    /* Circle recording overlay */
    .circle-recording-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .circle-recording-overlay.active {
      display: flex;
    }

    .circle-recording-overlay video {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary);
    }

    .circle-recording-overlay .timer {
      color: white;
      font-size: 24px;
      margin-top: 20px;
      font-weight: 700;
    }

    .circle-recording-overlay .cancel-btn {
      margin-top: 20px;
      padding: 10px 30px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Hidden file input */
    #photoInput {
      display: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: absolute;
        z-index: 20;
        height: 100%;
        transition: transform 0.3s;
      }

      .sidebar.hidden {
        transform: translateX(-100%);
      }

      .chat-area {
        width: 100%;
      }

      .back-btn {
        display: flex !important;
      }

      .message {
        max-width: 85%;
      }
    }

    .back-btn {
      display: none;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: var(--primary-bg);
      color: var(--primary);
      font-size: 18px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    /* Typing indicator */
    .typing-indicator {
      font-size: 13px;
      color: var(--primary-light);
      font-style: italic;
      padding: 4px 20px;
      height: 24px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 8px 8px 0;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 10px 10px 0 0;
      background: transparent;
      color: var(--text-light);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .tab-btn:hover {
      background: var(--primary-bg);
    }

    /* Online indicator */
    .online-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
    }

    .offline-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #9ca3af;
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="logo">💜</div>
      <h1>Purple Messenger</h1>
      <p>Введите ваше имя для входа</p>
      <input type="text" id="usernameInput" placeholder="Ваше имя..." maxlength="30" autofocus>
      <button onclick="login()">Войти ✨</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="app" id="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>💬 Сообщения</h2>
        <div class="my-username" id="myUsername"></div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Поиск по имени..." oninput="filterUsers()">
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="convTab" onclick="switchTab('conversations')">💬 Переписки</button>
        <button class="tab-btn" id="onlineTab" onclick="switchTab('online')">🟢 Онлайн (${connectedUsers.length})</button>
        <button class="tab-btn" id="allTab" onclick="switchTab('all')">👥 Все (${allRegisteredUsers.length})</button>
      </div>
      <div class="user-list" id="userList"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
      <div class="empty-chat" id="emptyChat">
        <div class="icon">💜</div>
        <h3>Purple Messenger</h3>
        <p>Выберите пользователя для начала общения</p>
      </div>

      <div class="chat-header" id="chatHeader" style="display:none;">
        <button class="back-btn" onclick="showSidebar()">←</button>
        <div class="user-avatar" id="chatAvatar"></div>
        <div>
          <div class="user-name" id="chatName"></div>
        </div>
      </div>

      <div class="messages" id="messages" style="display:none;"></div>

      <div class="typing-indicator" id="typingIndicator"></div>

      <div class="input-area" id="inputArea" style="display:none;">
        <div class="input-actions">
          <button onclick="document.getElementById('photoInput').click()" title="Фото">📷</button>
          <button id="voiceBtn" onclick="toggleVoiceRecording()" title="Голосовое">🎤</button>
          <button id="circleBtn" onclick="startCircleRecording()" title="Кружок">⭕</button>
        </div>
        <div class="text-input-wrapper">
          <textarea id="messageInput" placeholder="Сообщение..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>

      <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)">
    </div>
  </div>

  <!-- Image Modal -->
  <div class="image-modal" id="imageModal" onclick="this.classList.remove('active')">
    <img id="modalImage" src="" alt="Photo">
  </div>

  <!-- Circle Recording Overlay -->
  <div class="circle-recording-overlay" id="circleOverlay">
    <video id="circlePreview" autoplay muted playsinline></video>
    <div class="timer" id="circleTimer">0:00</div>
    <button class="cancel-btn" onclick="cancelCircleRecording()">✕ Отмена</button>
  </div>

  <script>
    // State
    let username = '';
    let ws = null;
    let currentUser = null;
    let messages = [];
    let connectedUsers = [];
    let allRegisteredUsers = [];
    let conversations = [];
    let contacts = [];
    let currentTab = 'conversations';
    let isTyping = false;
    let typingTimeout = null;

    // Recording state
    let voiceRecorder = null;
    let voiceChunks = [];
    let isRecording = false;
    let voiceDuration = 0;
    let voiceInterval = null;

    let circleStream = null;
    let circleRecorder = null;
    let circleChunks = [];
    let circleDuration = 0;
    let circleInterval = null;

    // Connection
    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}?username=${encodeURIComponent(username)}`);

      ws.onopen = () => {
        console.log('Connected to server');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };

      ws.onclose = () => {
        console.log('Disconnected, reconnecting...');
        setTimeout(connect, 3000);
      };

      ws.onerror = (err) => {
        console.error('WebSocket error', err);
      };
    }

    function handleMessage(data) {
      switch (data.type) {
        case 'online_users':
          connectedUsers = data.users || [];
          updateUI();
          break;

        case 'all_users':
          allRegisteredUsers = data.users || [];
          updateUI();
          break;

        case 'conversations':
          conversations = data.conversations || [];
          renderConversations();
          break;

        case 'contacts':
          contacts = data.contacts || [];
          break;

        case 'chat_history':
          if (data.user === currentUser) {
            messages = data.messages || [];
            renderMessages();
          }
          break;

        case 'chat':
        case 'photo':
        case 'voice':
        case 'circle':
          messages.push(data);
          renderMessages();
          // Обновляем список переписок
          const idx = conversations.findIndex(c => 
            (c.from === username && c.to === data.from) ||
            (c.to === username && c.from === data.from)
          );
          if (idx >= 0) {
            conversations.splice(idx, 1);
          }
          conversations.unshift(data);
          renderConversations();
          break;

        case 'online_update':
          connectedUsers = data.users || [];
          updateUI();
          break;
      }
    }

    // Login
    function login() {
      const input = document.getElementById('usernameInput').value.trim();
      if (!input) {
        input.focus();
        return;
      }
      username = input;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('active');
      document.getElementById('myUsername').textContent = username;
      connect();
    }

    document.getElementById('usernameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    // UI Update
    function updateUI() {
      document.getElementById('onlineTab').textContent = `Онлайн (${connectedUsers.length})`;
      document.getElementById('allTab').textContent = `Все (${allRegisteredUsers.length})`;
      renderConversations();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('convTab').classList.toggle('active', tab === 'conversations');
      document.getElementById('onlineTab').classList.toggle('active', tab === 'online');
      document.getElementById('allTab').classList.toggle('active', tab === 'all');
      renderConversations();
    }

    // Conversations List
    function renderConversations() {
      const list = document.getElementById('userList');
      
      if (currentTab === 'conversations') {
        const filtered = conversations.filter(c => {
          const query = document.getElementById('searchInput').value.toLowerCase();
          const otherUser = c.from === username ? c.to : c.from;
          return otherUser.toLowerCase().includes(query);
        });

        if (filtered.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af;">Нет переписок<br><small>Начните общение 💜</small></div>';
          return;
        }

        list.innerHTML = filtered.map(c => {
          const otherUser = c.from === username ? c.to : c.from;
          const initial = otherUser.charAt(0).toUpperCase();
          const lastMsg = getLastMsgText(c);
          const isOnline = connectedUsers.includes(otherUser);
          const badge = isOnline ? '<span class="online-badge"></span>' : '<span class="offline-badge"></span>';
          const time = c.timestamp ? new Date(c.timestamp).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}) : '';
          
          return `
            <div class="user-item ${otherUser === currentUser ? 'active' : ''}" onclick="selectUser('${otherUser}')">
              <div class="user-avatar">${initial}</div>
              <div class="user-info">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <div class="user-name">${escapeHtml(otherUser)}${badge}</div>
                  <div class="user-last-msg" style="font-size:11px;opacity:0.6;">${time}</div>
                </div>
                <div class="user-last-msg">${escapeHtml(lastMsg)}</div>
              </div>
            </div>
          `;
        }).join('');
      } else if (currentTab === 'online') {
        const filtered = connectedUsers.filter(u => {
          const query = document.getElementById('searchInput').value.toLowerCase();
          return u.toLowerCase().includes(query) && u !== username;
        });

        if (filtered.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af;">Нет пользователей<br><small>Откройте в другой вкладке</small></div>';
          return;
        }

        list.innerHTML = filtered.map(u => {
          const initial = u.charAt(0).toUpperCase();
          const lastMsg = getLastMessage(u);
          const badge = '<span class="online-badge"></span>';
          return `
            <div class="user-item ${u === currentUser ? 'active' : ''}" onclick="selectUser('${u}')">
              <div class="user-avatar">${initial}</div>
              <div class="user-info">
                <div class="user-name">${escapeHtml(u)}${badge}</div>
                <div class="user-last-msg">${escapeHtml(lastMsg) || 'Начните общение 💜'}</div>
              </div>
            </div>
          `;
        }).join('');
      } else if (currentTab === 'all') {
        const filtered = allRegisteredUsers.filter(u => {
          const query = document.getElementById('searchInput').value.toLowerCase();
          return u.toLowerCase().includes(query) && u !== username;
        });

        if (filtered.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af;">Нет зарегистрированных пользователей</div>';
          return;
        }

        list.innerHTML = filtered.map(u => {
          const initial = u.charAt(0).toUpperCase();
          const lastMsg = getLastMessage(u);
          const isOnline = connectedUsers.includes(u);
          const badge = isOnline ? '<span class="online-badge"></span>' : '<span class="offline-badge"></span>';
          return `
            <div class="user-item ${u === currentUser ? 'active' : ''}" onclick="selectUser('${u}')">
              <div class="user-avatar">${initial}</div>
              <div class="user-info">
                <div class="user-name">${escapeHtml(u)}${badge}</div>
                <div class="user-last-msg">${escapeHtml(lastMsg) || 'Начните общение 💜'}</div>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function getLastMsgText(msg) {
      switch (msg.type) {
        case 'chat': return msg.text;
        case 'photo': return '📷 Фото';
        case 'voice': return '🎤 Голосовое';
        case 'circle': return '⭕ Кружок';
        default: return '';
      }
    }

    function getLastMessage(user) {
      const userMsgs = messages.filter(m =>
        (m.from === user && m.to === username) ||
        (m.from === username && m.to === user)
      );
      const last = userMsgs[userMsgs.length - 1];
      if (!last) return '';

      switch (last.type) {
        case 'chat': return last.text;
        case 'photo': return '📷 Фото';
        case 'voice': return '🎤 Голосовое';
        case 'circle': return '⭕ Кружок';
        default: return '';
      }
    }

    // Chat
    function selectUser(user) {
      currentUser = user;
      document.getElementById('emptyChat').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('messages').style.display = 'flex';
      document.getElementById('inputArea').style.display = 'flex';

      const initial = user.charAt(0).toUpperCase();
      document.getElementById('chatAvatar').textContent = initial;
      document.getElementById('chatName').textContent = user;

      // Загружаем историю чата
      messages = [];
      ws.send(JSON.stringify({
        type: 'get_chat',
        to: user
      }));

      renderMessages();
      renderConversations();

      // Mobile
      document.getElementById('sidebar').classList.add('hidden');
    }

    function showSidebar() {
      document.getElementById('sidebar').classList.remove('hidden');
      currentUser = null;
      document.getElementById('emptyChat').style.display = 'flex';
      document.getElementById('chatHeader').style.display = 'none';
      document.getElementById('messages').style.display = 'none';
      document.getElementById('inputArea').style.display = 'none';
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      if (!currentUser) return;

      const chatMessages = messages.filter(m =>
        (m.from === currentUser && m.to === username) ||
        (m.from === username && m.to === currentUser)
      );

      container.innerHTML = chatMessages.map(m => {
        const isSent = m.from === username;
        const time = new Date(m.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        let content = '';
        switch (m.type) {
          case 'chat':
            content = `<div>${escapeHtml(m.text)}</div>`;
            break;
          case 'photo':
            content = `<img src="${m.url}" alt="Photo" onclick="openImage(this.src)"><div class="message-type-label">📷 Фото</div>`;
            break;
          case 'voice':
            content = `<audio controls src="${m.url}"></audio><div class="message-type-label">🎤 Голосовое (${m.duration || 0}с)</div>`;
            break;
          case 'circle':
            content = `<video controls src="${m.url}" width="100%"></video><div class="message-type-label">⭕ Кружок (${m.duration || 0}с)</div>`;
            break;
        }

        return `
          <div class="message ${isSent ? 'sent' : 'received'}">
            ${!isSent ? `<div class="sender-name">${escapeHtml(m.from)}</div>` : ''}
            ${content}
            <div class="time">${time}</div>
          </div>
        `;
      }).join('');

      container.scrollTop = container.scrollHeight;
    }

    // Send Message
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      ws.send(JSON.stringify({
        type: 'chat',
        from: username,
        to: currentUser,
        text: text
      }));

      input.value = '';
      input.style.height = 'auto';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // Photo
    function handlePhoto(event) {
      const file = event.target.files[0];
      if (!file || !currentUser) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        ws.send(JSON.stringify({
          type: 'photo',
          from: username,
          to: currentUser,
          url: e.target.result
        }));
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    // Voice Recording
    async function toggleVoiceRecording() {
      if (isRecording) {
        stopVoiceRecording();
      } else {
        await startVoiceRecording();
      }
    }

    async function startVoiceRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        voiceChunks = [];
        voiceRecorder = new MediaRecorder(stream);
        voiceRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) voiceChunks.push(e.data);
        };
        voiceRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          if (voiceChunks.length > 0 && currentUser) {
            const blob = new Blob(voiceChunks, { type: 'audio/ogg' });
            const url = URL.createObjectURL(blob);
            ws.send(JSON.stringify({
              type: 'voice',
              from: username,
              to: currentUser,
              url: url,
              duration: voiceDuration
            }));
          }
          voiceDuration = 0;
        };

        voiceRecorder.start();
        isRecording = true;
        voiceDuration = 0;

        const btn = document.getElementById('voiceBtn');
        btn.classList.add('recording');
        btn.textContent = '⏹';

        voiceInterval = setInterval(() => {
          voiceDuration++;
          if (voiceDuration >= 60) {
            stopVoiceRecording();
          }
        }, 1000);

      } catch (err) {
        alert('Не удалось получить доступ к микрофону');
        console.error(err);
      }
    }

    function stopVoiceRecording() {
      if (voiceRecorder && voiceRecorder.state !== 'inactive') {
        voiceRecorder.stop();
      }
      isRecording = false;
      clearInterval(voiceInterval);

      const btn = document.getElementById('voiceBtn');
      btn.classList.remove('recording');
      btn.textContent = '🎤';
    }

    // Circle Recording
    async function startCircleRecording() {
      if (!currentUser) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        circleStream = stream;

        const preview = document.getElementById('circlePreview');
        preview.srcObject = stream;

        circleChunks = [];
        circleRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        circleRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) circleChunks.push(e.data);
        };
        circleRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          preview.srcObject = null;

          if (circleChunks.length > 0 && currentUser) {
            const blob = new Blob(circleChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            ws.send(JSON.stringify({
              type: 'circle',
              from: username,
              to: currentUser,
              url: url,
              duration: circleDuration
            }));
          }
          circleDuration = 0;
          document.getElementById('circleOverlay').classList.remove('active');
        };

        circleRecorder.start();
        circleDuration = 0;

        document.getElementById('circleOverlay').classList.add('active');

        circleInterval = setInterval(() => {
          circleDuration++;
          const mins = Math.floor(circleDuration / 60);
          const secs = circleDuration % 60;
          document.getElementById('circleTimer').textContent =
            `${mins}:${secs.toString().padStart(2, '0')}`;

          if (circleDuration >= 60) {
            cancelCircleRecording();
          }
        }, 1000);

      } catch (err) {
        alert('Не удалось получить доступ к камере');
        console.error(err);
      }
    }

    function cancelCircleRecording() {
      if (circleRecorder && circleRecorder.state !== 'inactive') {
        circleRecorder.stop();
      }
      clearInterval(circleInterval);
      circleDuration = 0;
      document.getElementById('circleOverlay').classList.remove('active');
    }

    // Image Modal
    function openImage(src) {
      document.getElementById('modalImage').src = src;
      document.getElementById('imageModal').classList.add('active');
    }

    // Utility
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
