<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Purple Messenger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #17212b; height: 100vh; overflow: hidden; }
    
    /* Login Screen */
    .login-screen {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-box {
      background: #1e293b; padding: 40px; border-radius: 16px; width: 90%; max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .login-box h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 28px; }
    .login-box input {
      width: 100%; padding: 14px 16px; margin-bottom: 16px;
      background: #0f172a; border: 2px solid #334155; border-radius: 12px;
      color: #fff; font-size: 16px; outline: none;
    }
    .login-box input:focus { border-color: #667eea; }
    .login-box button {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; border-radius: 12px; font-size: 16px;
      font-weight: 600; cursor: pointer; transition: transform 0.2s;
    }
    .login-box button:hover { transform: translateY(-2px); }

    /* App Layout - Telegram Style */
    .app { display: none; height: 100vh; }
    .app.active { display: flex; }

    /* Sidebar - Chat List */
    .sidebar {
      width: 380px; background: #1e293b; display: flex; flex-direction: column;
      border-right: 1px solid #334155;
    }
    .sidebar-header {
      padding: 12px 16px; background: #0f172a; display: flex;
      align-items: center; gap: 12px; height: 60px;
    }
    .my-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 18px;
    }
    .my-info { flex: 1; }
    .my-username { color: #fff; font-weight: 600; font-size: 15px; }
    .my-coins { color: #94a3b8; font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .coins-icon { color: #fbbf24; }
    
    .search-box {
      padding: 8px 12px; background: #0f172a;
    }
    .search-box input {
      width: 100%; padding: 10px 16px; background: #1e293b;
      border: none; border-radius: 20px; color: #fff; font-size: 14px;
      outline: none;
    }
    .search-box input::placeholder { color: #64748b; }
    
    .tabs {
      display: flex; padding: 8px 12px; background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      flex: 1; padding: 8px; border: none; background: transparent;
      color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer;
      border-radius: 8px; transition: all 0.2s;
    }
    .tab-btn.active { background: #334155; color: #fff; }
    
    .user-list { flex: 1; overflow-y: auto; }
    .user-list::-webkit-scrollbar { width: 6px; }
    .user-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    
    .user-item {
      display: flex; align-items: center; padding: 12px 16px;
      cursor: pointer; transition: background 0.2s;
      border-bottom: 1px solid rgba(51, 65, 85, 0.3);
    }
    .user-item:hover { background: #334155; }
    .user-item.active { background: #1e40af; }
    
    .user-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 20px;
      margin-right: 12px; flex-shrink: 0; position: relative;
    }
    .user-avatar img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    }
    .online-dot {
      position: absolute; bottom: 2px; right: 2px; width: 12px;
      height: 12px; background: #22c55e; border-radius: 50%;
      border: 2px solid #1e293b;
    }
    
    .user-info { flex: 1; min-width: 0; }
    .user-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .user-name-row { display: flex; align-items: center; gap: 6px; }
    .user-name { font-weight: 600; color: #fff; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-badge { color: #ef4444; font-size: 14px; flex-shrink: 0; }
    .user-time { color: #64748b; font-size: 12px; flex-shrink: 0; }
    .user-last-msg { color: #94a3b8; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-last-msg.typing { color: #667eea; font-style: italic; }

    /* Chat Area - Telegram Style */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      background: #0f172a; position: relative;
    }
    .chat-bg {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231e293b' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.3;
    }
    
    .chat-header {
      padding: 12px 20px; background: #1e293b; display: flex;
      align-items: center; gap: 12px; height: 60px;
      border-bottom: 1px solid #334155; position: relative; z-index: 1;
    }
    .chat-header .user-avatar { width: 42px; height: 42px; font-size: 18px; }
    .chat-header-info { flex: 1; }
    .chat-header-name { color: #fff; font-weight: 600; font-size: 15px; }
    .chat-header-status { color: #64748b; font-size: 13px; }
    .chat-header-status.online { color: #22c55e; }
    
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      width: 40px; height: 40px; border: none; border-radius: 50%;
      background: transparent; color: #94a3b8; font-size: 20px;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .header-btn:hover { background: #334155; color: #fff; }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 20px; display: flex;
      flex-direction: column; gap: 8px; position: relative; z-index: 1;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    
    .message {
      max-width: 70%; padding: 10px 14px; position: relative;
      word-wrap: break-word; animation: msgIn 0.2s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.sent {
      align-self: flex-end; background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border-radius: 18px 18px 4px 18px;
    }
    .message.received {
      align-self: flex-start; background: #1e293b;
      border-radius: 18px 18px 18px 4px;
    }
    
    .msg-content { font-size: 15px; line-height: 1.4; margin-bottom: 4px; }
    .msg-sender { font-size: 12px; color: #667eea; font-weight: 600; margin-bottom: 4px; }
    .message.sent .msg-sender { color: rgba(255,255,255,0.8); text-align: right; }
    
    .msg-footer {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 4px; margin-top: 2px;
    }
    .msg-time { font-size: 11px; opacity: 0.7; }
    .msg-check { font-size: 12px; }
    
    .message img {
      max-width: 100%; border-radius: 12px; margin-top: 6px;
      cursor: pointer;
    }
    .message audio { width: 250px; margin-top: 6px; }
    .message video { max-width: 100%; border-radius: 12px; margin-top: 6px; }
    
    .gift-message {
      font-size: 48px; text-align: center; padding: 20px;
      animation: giftPop 0.5s ease;
    }
    @keyframes giftPop {
      0% { transform: scale(0) rotate(-10deg); }
      50% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* Empty State */
    .empty-chat {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; color: #64748b; text-align: center;
      position: relative; z-index: 1;
    }
    .empty-chat .icon { font-size: 64px; margin-bottom: 16px; }
    .empty-chat h2 { color: #94a3b8; margin-bottom: 8px; }

    /* Input Area - Telegram Style */
    .input-area {
      padding: 12px 20px; background: #1e293b;
      display: flex; align-items: flex-end; gap: 12px;
      border-top: 1px solid #334155; position: relative; z-index: 1;
    }
    
    .input-actions { display: flex; gap: 8px; }
    .input-btn {
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: transparent; color: #94a3b8; font-size: 22px;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .input-btn:hover { background: #334155; color: #fff; }
    
    .text-input-wrapper { flex: 1; }
    .text-input-wrapper textarea {
      width: 100%; padding: 12px 16px; background: #0f172a;
      border: 2px solid transparent; border-radius: 22px;
      color: #fff; font-size: 15px; resize: none; outline: none;
      max-height: 120px; font-family: inherit;
      transition: border-color 0.2s;
    }
    .text-input-wrapper textarea:focus { border-color: #667eea; }
    .text-input-wrapper textarea::placeholder { color: #64748b; }
    
    .send-btn {
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; font-size: 20px; cursor: pointer;
      transition: transform 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .send-btn:hover { transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }

    /* Modals - Telegram Style */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1e293b; padding: 0; border-radius: 16px;
      width: 90%; max-width: 500px; max-height: 80vh; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 20px; background: #0f172a;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { color: #fff; font-size: 20px; }
    .close-btn {
      background: none; border: none; font-size: 28px; cursor: pointer;
      color: #94a3b8; transition: color 0.2s;
    }
    .close-btn:hover { color: #fff; }
    .modal-body { padding: 20px; overflow-y: auto; max-height: calc(80vh - 80px); }

    /* Gifts Grid */
    .gifts-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }
    .gift-item {
      background: #0f172a; border: 2px solid #334155; border-radius: 12px;
      padding: 16px 8px; text-align: center; cursor: pointer;
      transition: all 0.2s;
    }
    .gift-item:hover { border-color: #667eea; transform: translateY(-2px); }
    .gift-item .gift-emoji { font-size: 36px; margin-bottom: 8px; }
    .gift-item .gift-name { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .gift-item .gift-price { font-size: 12px; color: #fbbf24; font-weight: bold; }

    /* Clicker */
    .clicker-area { text-align: center; padding: 20px; }
    .click-btn {
      width: 140px; height: 140px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white; font-size: 56px; cursor: pointer;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
      transition: transform 0.1s;
    }
    .click-btn:active { transform: scale(0.95); }
    .click-info { margin-top: 24px; font-size: 16px; color: #94a3b8; }
    .click-coins { font-size: 36px; color: #fbbf24; font-weight: bold; margin-top: 12px; }

    /* Profile */
    .profile-header {
      text-align: center; padding: 30px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border-radius: 16px; margin-bottom: 20px;
    }
    .profile-avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: bold; margin: 0 auto 12px;
      border: 3px solid white;
    }
    .profile-avatar img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    }
    .profile-name { font-size: 22px; font-weight: bold; }
    .profile-coins { margin-top: 12px; font-size: 18px; }
    .profile-gifts {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 10px; margin-top: 15px;
    }
    .profile-gift {
      background: #0f172a; border-radius: 10px; padding: 12px 8px;
      text-align: center; font-size: 28px;
    }

    /* Admin Panel */
    .admin-panel {
      background: #1c1017; border: 2px solid #ef4444; border-radius: 12px;
      padding: 16px; margin-top: 16px;
    }
    .admin-panel h3 { color: #ef4444; margin-bottom: 12px; font-size: 16px; }
    .admin-input {
      width: 100%; padding: 10px 14px; background: #0f172a;
      border: 2px solid #334155; border-radius: 8px;
      color: #fff; font-size: 14px; outline: none; margin-bottom: 10px;
    }
    .admin-input:focus { border-color: #ef4444; }
    .admin-btn {
      background: #ef4444; color: white; border: none; padding: 10px 20px;
      border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
      transition: background 0.2s;
    }
    .admin-btn:hover { background: #dc2626; }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: absolute; z-index: 20; height: 100%; }
      .sidebar.hidden { transform: translateX(-100%); }
      .chat-area { width: 100%; }
      .back-btn {
        display: flex !important; width: 40px; height: 40px;
        border: none; background: transparent; color: #94a3b8;
        font-size: 20px; cursor: pointer; align-items: center;
        justify-content: center;
      }
      .message { max-width: 85%; }
      .input-area { padding: 10px 12px; }
    }
    .back-btn { display: none; }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>💜 Messenger</h1>
      <input type="text" id="usernameInput" placeholder="Логин..." maxlength="20" autofocus>
      <input type="password" id="passwordInput" placeholder="Пароль..." maxlength="30">
      <button onclick="login()">Войти</button>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="my-avatar" id="myAvatar">?</div>
        <div class="my-info">
          <div class="my-username" id="myUsername"></div>
          <div class="my-coins"><span class="coins-icon">💰</span> <span id="myCoins">0</span></div>
        </div>
      </div>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Поиск..." oninput="renderChats()">
      </div>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('conversations')">Чаты</button>
        <button class="tab-btn" onclick="switchTab('online')">Онлайн</button>
        <button class="tab-btn" onclick="switchTab('all')">Все</button>
      </div>
      
      <div class="user-list" id="userList"></div>
    </div>

    <!-- Chat -->
    <div class="chat-area" id="chatArea">
      <div class="chat-bg"></div>
      
      <div class="empty-chat" id="emptyChat">
        <div class="icon">💬</div>
        <h2>Purple Messenger</h2>
        <p>Выберите чат для начала общения</p>
      </div>

      <div class="chat-header" id="chatHeader" style="display:none;">
        <button class="back-btn" onclick="showSidebar()">←</button>
        <div class="user-avatar" id="chatAvatar" onclick="openProfile(currentUser)"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatName"></div>
          <div class="chat-header-status" id="chatStatus"></div>
        </div>
        <div class="header-actions">
          <button class="header-btn" onclick="openGifts()">🎁</button>
          <button class="header-btn" onclick="openClicker()">💰</button>
          <button class="header-btn" onclick="openProfile(currentUser)">👤</button>
        </div>
      </div>

      <div class="messages" id="messages" style="display:none;"></div>

      <div class="input-area" id="inputArea" style="display:none;">
        <div class="input-actions">
          <button class="input-btn" onclick="openGifts()">🎁</button>
          <button class="input-btn" onclick="openClicker()">💰</button>
        </div>
        <div class="text-input-wrapper">
          <textarea id="messageInput" placeholder="Сообщение..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- Gifts Modal -->
  <div class="modal" id="giftsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🎁 Подарки</h2>
        <button class="close-btn" onclick="closeModal('giftsModal')">×</button>
      </div>
      <div class="modal-body">
        <p style="color: #94a3b8; margin-bottom: 16px;">Отправить для: <strong style="color: #fff;" id="giftToUser"></strong></p>
        <div class="gifts-grid" id="giftsGrid"></div>
      </div>
    </div>
  </div>

  <!-- Clicker Modal -->
  <div class="modal" id="clickerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>💰 Кликер</h2>
        <button class="close-btn" onclick="closeModal('clickerModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="clicker-area">
          <button class="click-btn" onclick="doClick()">💎</button>
          <div class="click-info">Нажимай чтобы заработать монеты!</div>
          <div class="click-coins">💰 <span id="clickerCoins">0</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile Modal -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>👤 Профиль</h2>
        <button class="close-btn" onclick="closeModal('profileModal')">×</button>
      </div>
      <div class="modal-body" id="profileContent"></div>
    </div>
  </div>

  <script>
    let username = '';
    let password = '';
    let ws = null;
    let currentUser = null;
    let messages = [];
    let conversations = [];
    let connectedUsers = [];
    let allUsers = [];
    let currentTab = 'conversations';
    let myData = { coins: 0, isAdmin: false, avatar: '' };

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
      ws.onopen = () => console.log('Connected');
      ws.onmessage = (event) => handleMessage(JSON.parse(event.data));
      ws.onclose = () => setTimeout(connect, 3000);
    }

    function handleMessage(data) {
      switch(data.type) {
        case 'online_users':
          connectedUsers = data.users;
          myData = data.myData || myData;
          updateUI();
          renderChats();
          break;
        case 'all_users':
          allUsers = data.users;
          renderChats();
          break;
        case 'conversations':
          conversations = data.conversations;
          renderChats();
          break;
        case 'chat_history':
          if (data.user === currentUser) {
            messages = data.messages;
            renderMessages();
          }
          break;
        case 'chat': case 'photo': case 'voice': case 'circle':
          messages.push(data);
          renderMessages();
          updateConversation(data);
          break;
        case 'gift_received':
          if (data.to === username) {
            showMessage(`<div class="gift-message">${data.giftName}</div>`);
            playGiftSound();
          }
          break;
        case 'coins_update':
          myData.coins = data.coins;
          updateUI();
          break;
        case 'avatar_update':
          myData.avatar = data.avatar;
          updateUI();
          break;
        case 'profile_data':
          renderProfile(data.user, data.gifts);
          break;
        case 'online_update':
          connectedUsers = data.users;
          renderChats();
          break;
        case 'error':
          alert(data.message);
          break;
        case 'you_are_admin':
          myData.isAdmin = true;
          alert('🎉 Вы администратор!');
          updateUI();
          break;
      }
    }

    function updateConversation(msg) {
      const idx = conversations.findIndex(c =>
        (c.from === username && c.to === msg.from) ||
        (c.to === username && c.from === msg.from)
      );
      if (idx >= 0) conversations.splice(idx, 1);
      conversations.unshift(msg);
      renderChats();
    }

    function login() {
      const user = document.getElementById('usernameInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      if (!user || !pass) { alert('Введите логин и пароль!'); return; }
      username = user;
      password = pass;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('active');
      document.getElementById('myUsername').textContent = user;
      connect();
    }

    document.getElementById('usernameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('passwordInput').focus();
    });
    document.getElementById('passwordInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderChats();
    }

    function renderChats() {
      const list = document.getElementById('userList');
      const query = document.getElementById('searchInput').value.toLowerCase();
      let items = [];

      if (currentTab === 'conversations') {
        items = conversations.filter(c => {
          const u = c.from === username ? c.to : c.from;
          return u.toLowerCase().includes(query);
        });
      } else if (currentTab === 'online') {
        items = connectedUsers.filter(u => u !== username && u.toLowerCase().includes(query));
      } else {
        items = allUsers.filter(u => u !== username && u.toLowerCase().includes(query));
      }

      list.innerHTML = items.map(item => {
        const isOnline = connectedUsers.includes(item);
        const lastMsg = getLastMsgText(item);
        const time = getLastTime(item);
        const initial = item.charAt(0).toUpperCase();
        const isAdmin = item.toLowerCase() === 'vortex';
        
        return `
          <div class="user-item ${item === currentUser ? 'active' : ''}" onclick="selectUser('${item}')">
            <div class="user-avatar" onclick="event.stopPropagation(); openProfile('${item}')">
              ${initial}
              ${isOnline ? '<div class="online-dot"></div>' : ''}
            </div>
            <div class="user-info">
              <div class="user-top">
                <div class="user-name-row">
                  <div class="user-name">${item} ${isAdmin ? '<span class="admin-badge">✓</span>' : ''}</div>
                </div>
                <div class="user-time">${time}</div>
              </div>
              <div class="user-last-msg">${lastMsg || 'Начните общение'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function getLastMsgText(user) {
      const userMsgs = conversations.filter(c =>
        (c.from === user && c.to === username) ||
        (c.from === username && c.to === user)
      );
      const last = userMsgs[userMsgs.length - 1];
      if (!last) return '';
      if (last.type === 'chat') return last.text;
      if (last.type === 'photo') return '📷 Фото';
      if (last.type === 'voice') return '🎤 Голосовое';
      return '';
    }

    function getLastTime(user) {
      const userMsgs = conversations.filter(c =>
        (c.from === user && c.to === username) ||
        (c.from === username && c.to === user)
      );
      const last = userMsgs[userMsgs.length - 1];
      return last && last.timestamp ? new Date(last.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
    }

    function selectUser(user) {
      currentUser = user;
      document.getElementById('emptyChat').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('messages').style.display = 'flex';
      document.getElementById('inputArea').style.display = 'flex';
      document.getElementById('chatAvatar').textContent = user.charAt(0).toUpperCase();
      document.getElementById('chatName').textContent = user;
      document.getElementById('chatStatus').textContent = connectedUsers.includes(user) ? 'онлайн' : 'оффлайн';
      document.getElementById('chatStatus').className = 'chat-header-status' + (connectedUsers.includes(user) ? ' online' : '');
      document.getElementById('sidebar').classList.add('hidden');
      
      messages = [];
      ws.send(JSON.stringify({ type: 'get_chat', to: user }));
    }

    function showSidebar() {
      document.getElementById('sidebar').classList.remove('hidden');
      currentUser = null;
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      if (!currentUser) return;
      
      const chatMsgs = messages.filter(m =>
        (m.from === currentUser && m.to === username) ||
        (m.from === username && m.to === currentUser)
      );

      container.innerHTML = chatMsgs.map(m => {
        const isSent = m.from === username;
        const time = new Date(m.timestamp).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
        let content = '';
        
        if (m.type === 'chat') content = `<div class="msg-content">${escapeHtml(m.text)}</div>`;
        else if (m.type === 'photo') content = `<img src="${m.url}">`;
        else if (m.type === 'voice') content = `<audio controls src="${m.url}"></audio>`;
        else if (m.type === 'gift') content = `<div class="gift-message">${m.giftName}</div>`;
        else content = `<div class="msg-content">${escapeHtml(m.text || '')}</div>`;
        
        return `
          <div class="message ${isSent ? 'sent' : 'received'}">
            ${!isSent ? `<div class="msg-sender">${m.from}</div>` : ''}
            ${content}
            <div class="msg-footer">
              <span class="msg-time">${time}</span>
              ${isSent ? '<span class="msg-check">✓✓</span>' : ''}
            </div>
          </div>
        `;
      }).join('');
      
      container.scrollTop = container.scrollHeight;
    }

    function showMessage(html) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.innerHTML = html;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentUser) return;
      
      ws.send(JSON.stringify({
        type: 'chat', from: username, to: currentUser, text: text
      }));
      input.value = '';
      input.style.height = 'auto';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function updateUI() {
      document.getElementById('myCoins').textContent = myData.coins;
      document.getElementById('myAvatar').textContent = myData.avatar ? '' : username.charAt(0).toUpperCase();
      if (myData.avatar) {
        document.getElementById('myAvatar').innerHTML = `<img src="${myData.avatar}">`;
      }
    }

    function openGifts() {
      if (!currentUser) { alert('Выберите пользователя!'); return; }
      document.getElementById('giftToUser').textContent = currentUser;
      renderGifts();
      document.getElementById('giftsModal').classList.add('active');
    }

    function renderGifts() {
      const GIFTS = [
        { type: 'rose', name: '🌹 Роза', price: 50 },
        { type: 'heart', name: '❤️ Сердце', price: 100 },
        { type: 'star', name: '⭐ Звезда', price: 75 },
        { type: 'flower', name: '🌸 Цветок', price: 60 },
        { type: 'ring', name: '💍 Кольцо', price: 200 },
        { type: 'crown', name: '👑 Корона', price: 500 },
        { type: 'diamond', name: '💎 Алмаз', price: 1000 },
        { type: 'cake', name: '🎂 Торт', price: 150 },
        { type: 'coffee', name: '☕ Кофе', price: 30 },
        { type: 'beer', name: '🍺 Пиво', price: 40 },
        { type: 'rocket', name: '🚀 Ракета', price: 300 },
        { type: 'fire', name: '🔥 Огонь', price: 250 },
      ];
      
      const grid = document.getElementById('giftsGrid');
      grid.innerHTML = GIFTS.map(gift => `
        <div class="gift-item" onclick="sendGift('${gift.type}', '${gift.name}', ${gift.price})">
          <div class="gift-emoji">${gift.name.split(' ')[0]}</div>
          <div class="gift-name">${gift.name.split(' ')[1] || gift.name}</div>
          <div class="gift-price">💰 ${gift.price}</div>
        </div>
      `).join('');
    }

    function sendGift(type, name, price) {
      if (myData.coins < price && !myData.isAdmin) {
        alert('Недостаточно монет!');
        return;
      }
      
      ws.send(JSON.stringify({
        type: 'send_gift',
        from: username,
        to: currentUser,
        giftType: type,
        giftName: name,
        price: price
      }));
      
      closeModal('giftsModal');
    }

    function playGiftSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.frequency.value = 800;
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.5);
      } catch(e) {}
    }

    function openClicker() {
      document.getElementById('clickerCoins').textContent = myData.coins;
      document.getElementById('clickerModal').classList.add('active');
    }

    function doClick() {
      ws.send(JSON.stringify({ type: 'clicker', amount: 1 }));
    }

    function openProfile(user) {
      user = user || currentUser;
      if (!user) return;
      document.getElementById('profileModal').classList.add('active');
      ws.send(JSON.stringify({ type: 'get_profile', username: user }));
    }

    function renderProfile(userData, userGifts) {
      const content = document.getElementById('profileContent');
      const isAdmin = userData.isAdmin || userData.username.toLowerCase() === 'vortex';
      const initial = userData.username.charAt(0).toUpperCase();
      
      let giftsHtml = '';
      if (userGifts && userGifts.length > 0) {
        giftsHtml = userGifts.map(g => `
          <div class="profile-gift" title="${g.giftName} от ${g.from}">
            ${g.giftName.split(' ')[0]}
          </div>
        `).join('');
      } else {
        giftsHtml = '<p style="color: #64748b; text-align: center; grid-column: 1/-1;">Нет подарков</p>';
      }
      
      let adminHtml = '';
      if (isAdmin) {
        adminHtml = `
          <div class="admin-panel">
            <h3>👑 Администратор</h3>
            <p style="color: #94a3b8; margin-bottom: 12px;">Выдайте админку:</p>
            <input type="text" class="admin-input" id="adminUsername" placeholder="Логин пользователя">
            <button class="admin-btn" onclick="giveAdmin()">Выдать админку</button>
          </div>
        `;
      }
      
      content.innerHTML = `
        <div class="profile-header">
          <div class="profile-avatar">${initial}</div>
          <div class="profile-name">${userData.username} ${isAdmin ? '<span class="admin-badge" style="color: #ef4444;">✓</span>' : ''}</div>
          <div class="profile-coins">💰 ${userData.coins} монет</div>
          ${isAdmin ? '<div style="margin-top: 12px; font-size: 14px; opacity: 0.9;">👑 Администратор</div>' : ''}
        </div>
        <h3 style="margin-bottom: 12px; color: #fff;">🎁 Подарки (${userGifts ? userGifts.length : 0})</h3>
        <div class="profile-gifts">${giftsHtml}</div>
        ${adminHtml}
      `;
    }

    function giveAdmin() {
      const target = document.getElementById('adminUsername').value.trim();
      if (!target) { alert('Введите логин!'); return; }
      ws.send(JSON.stringify({ type: 'give_admin', targetUsername: target }));
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.classList.remove('active');
      }
    }
  </script>
</body>
</html>
